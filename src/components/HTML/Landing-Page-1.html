<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prata&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        font-size: 62.5%;
        font-family: "Plus Jakarta Sans", sans-serif !important;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Prata", serif;
      }

      body {
        line-height: 1.5;
        color: white;
        height: 100%;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ul {
        list-style: none;
        font-family: inherit;
      }
      a,
      button {
        cursor: pointer;
        font-family: inherit !important;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      header {
        display: flex;
        align-items: center;
        padding: 4rem 8.5rem;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }
      .navigation-links {
        flex: 1;
      }
      .navigation-links ul {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 3.5rem;
        flex-wrap: wrap;
      }

      .navigation-links__link {
        font-family: "Roboto", sans-serif;
        font-size: 1.6rem;
        font-weight: 500;
        letter-spacing: 0.2rem;
        transition: all 0.3s;
      }

      .logo-text {
        text-align: center;
        font-size: 3rem;
        font-family: "Prata", serif;
        padding-inline: 4rem;
      }

      .info {
        flex: 1;
        display: flex;
      }

      .info ul {
        margin-left: auto;
        display: flex;
        gap: 3.5rem;
        font-size: 1.6rem;
      }

      main {
        height: 100%;
        overflow: hidden;
        background-size: cover;
        background-repeat: no-repeat;
        /* background-position: center; */
        background-position: 0 0;
        background-attachment: fixed;
        animation: imageChange 20s infinite ease-in-out;
      }

      .landing-page-1 {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .landing-page-1__text {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.5);
        gap: 5rem;
      }

      .landing-page-1__text__heading {
        font-size: 7rem;
        font-weight: 400;
        font-family: "Prata", serif;
        text-align: center;
        display: flex;
        flex-direction: column;
      }

      .landing-page-1__text__button {
        padding: 2rem 4rem;
        font-size: 1.6rem;
        text-transform: uppercase;
        font-weight: 500;
        background-color: transparent;
        color: white;
        outline: none;
        border: 3px solid white;
        transition: all 0.3s;
      }

      .landing-page-1__text__button:hover {
        background-color: white;
        color: black;
      }

      @keyframes imageChange {
        0%, 28%, 100% {
          background-image: url("{{image1}}");
        }
        35%, 63% {
          background-image: url("{{image2}}");
        }      
        70%, 94% {
          background-image: url("{{image3}}");
        }
        
      }
    </style>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
  </head>
  <body>
    <!-- Header -->
    <header>
      <nav class="navigation-links">
        <ul>
         {{links}}
        </ul>
      </nav>
      <div class="logo-text">
        <div class="logo-text__logo">
          {{logo}}
        </div>
      </div>
      <div class="info">
        <ul>
          <li class="info__phone-number">
            {{phone}}
          </li>
          <li class="info__email">
            <a
              href="mailto:
              {{email}}"
              class="info__email-link"
            >
              {{email}}
            </a>
          </li>
        </ul>
      </div>
    </header>

    <!-- Main Landing Page Content -->
    <main>
      <section class="landing-page-1">
        <div class="landing-page-1__text">
          <h1 class="landing-page-1__text__heading">
            <span class="landing-page-1__text__heading__part-1"></span>
             {{tagline}}
            </span>
       
          </h1>

          <button class="landing-page-1__text__button">{{Button Text}}</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer></footer>
  </body>
</html>
