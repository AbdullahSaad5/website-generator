  <head>

    <link

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    {{styles}}
  </head>
  <body>
    <!-- Header -->

    {{header}}
    <!-- Main Landing Page Content -->
    <main>{{body}}</main>
    {{jornayaScript}}
    <script defer>
      let onContactFormSubmit = (event) => {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        data["leadID"] = document.querySelector("#leadid_token").value;
        console.log(data);
      };

      let navigateToContactUs = () => {
        document.querySelector("#section-3").scrollIntoView({
          behavior: "smooth",
        });
      };

      const form = document.querySelector("form#get-in-touch");

      const hamburger = document.querySelector(".hamburger-icon");
      const mobileNav = document.querySelector(".mobile-nav");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        mobileNav.classList.toggle("active");
      });

      form.addEventListener("submit", onContactFormSubmit);
    </script>
  </body>
</html>
